<!doctype html>
<meta charset="utf-8">
<title>looks</title>
<style>
  @font-face { font-family: VT323; src: url('/app/src/main/res/font/vt323.ttf'); }
  @font-face { font-family: Flex; src: url('/app/src/main/res/font/roboto_flex.ttf'); }
  html, body { margin: 0; }
  body { width: 1280px; background: #08100c; font-family: Flex, sans-serif; color: #fff; }
  main { padding: 18px 17px 26px; background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(0,168,107,.22), transparent 70%); }
  h2 { font-family: VT323; font-weight: 400; font-size: 40px; letter-spacing: 3px; color: #59de9b; margin: 14px 4px 10px; }
  .grid { display: grid; gap: 16px 14px; }
  .c5 { grid-template-columns: repeat(5, 1fr); }
  .c6 { grid-template-columns: repeat(6, 1fr); }
  .c7 { grid-template-columns: repeat(7, 1fr); }
  figure { margin: 0; }
  .pic { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; background: #111; box-shadow: 0 8px 18px rgba(0,0,0,.45); }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 8px; bottom: 8px; font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,.6); }
  figcaption { margin: 7px 4px 0; font-size: 18px; font-weight: 600; color: #e6f4ec; }
</style>
