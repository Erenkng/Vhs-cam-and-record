<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VHS Cam shader lab</title>
  <style>
    @font-face { font-family: 'VT323'; src: url('../../app/src/main/res/font/vt323.ttf'); }
    body { margin: 0; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
    main { padding: 16px; display: grid; gap: 12px; }
    img { max-width: 100%; height: auto; background: #000; }
    label { margin-right: 12px; }
  </style>
</head>
<body>
<main>
  <div>
    <label>Image <input id="file" type="file" accept="image/*"></label>
    <label>Look
      <select id="look">
        <option value="VHS:SP">VHS SP</option>
        <option value="VHS:LP">VHS LP</option>
        <option value="VHS:EP">VHS EP</option>
        <option value="CCD">CCD</option>
        <option value="FILM">35mm film</option>
        <option value="POLAROID">Polaroid</option>
        <option value="GAMEBOY">8-bit</option>
        <option value="WEBCAM">Webcam</option>
        <option value="CCTV">CCTV</option>
      </select>
    </label>
    <label>Time <input id="time" type="number" value="3.0" step="0.5"></label>
  </div>
  <canvas id="out" width="960" height="720" hidden></canvas>
  <img id="result" alt="">
</main>
<script type="module" src="lab.js"></script>
</body>
</html>
