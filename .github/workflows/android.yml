name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew -p core test

      - name: App unit tests and screenshots
        run: ./gradlew :app:recordRoborazziDebug

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Print screenshots for review
        if: always()
        # Small JPEGs as base64 between markers, so the screenshots can be checked from the job log.
        run: |
          for f in app/build/outputs/roborazzi/*.png; do
            [ -e "$f" ] || continue
            echo "=== SCREENSHOT $(basename "$f") ==="
            convert "$f" -resize 300x -quality 55 jpg:- | base64 -w 0
            echo
            echo "=== END ==="
          done

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vhs-cam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            core/build/reports
          if-no-files-found: ignore
