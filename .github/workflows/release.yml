name: Release

# Pushing a tag such as v0.5, or running this workflow by hand with that tag, builds the signed
# APK and publishes it as a GitHub release (a manual run creates the tag on the chosen branch).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, matching versionName (e.g. v0.5)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Tags look like v0.5 or v1.0.2, not '$TAG'."
            exit 1
          fi
          if ! grep -q "versionName = \"${TAG#v}\"" app/build.gradle.kts; then
            echo "::error::$TAG does not match versionName in app/build.gradle.kts."
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      # The permanent key comes from the SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD secrets.
      # Without them the release is signed with a one-time key that only exists in this job,
      # so it still installs, but the next release cannot update it in place.
      - name: Prepare the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.p12"
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            # Pasting a secret on a phone can add line breaks or spaces; neither value has any.
            # A paste that does not decode is reported by the check below.
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" || true
            password="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')"
            echo "::add-mask::$password"
            # Check the key now, not after the tests, and say what to fix.
            if ! keytool -list -keystore "$keystore" -storetype PKCS12 -storepass "$password" -alias vhscam > /dev/null 2>&1; then
              echo "::error::The SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD secrets do not open a key store with the alias vhscam. Add both secrets again."
              exit 1
            fi
            echo "ONE_TIME_KEY=false" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets; signing with a one-time key."
            password="$(openssl rand -hex 24)"
            echo "::add-mask::$password"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass "$password" -keypass "$password" \
              -alias vhscam -keyalg RSA -keysize 4096 -sigalg SHA256withRSA -validity 10000 \
              -dname "CN=VHS Cam, OU=Android, O=Erenkng"
            echo "ONE_TIME_KEY=true" >> "$GITHUB_ENV"
          fi
          echo "SIGNING_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          ./gradlew -p core test
          ./gradlew :app:testDebugUnitTest

      - name: Build the signed APK
        run: ./gradlew :app:assembleRelease

      - name: Verify the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          apk="VHS-Cam-$tag.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          notes="$RUNNER_TEMP/notes.md"
          if [ -f "docs/release-notes/$tag.md" ]; then
            cp "docs/release-notes/$tag.md" "$notes"
          else
            echo "VHS Cam $tag" > "$notes"
          fi
          if [ "$ONE_TIME_KEY" = true ]; then
            printf '\n> **Not:** Bu APK tek seferlik bir anahtarla imzalandı. Sonraki bir sürümü kurmadan önce bu sürümü kaldırmanız gerekir; çektiğiniz fotoğraf ve videolar telefonun galerisinde kalır.\n' >> "$notes"
          else
            printf '\n> APK, projenin kalıcı sürüm anahtarıyla imzalıdır; sonraki sürümler bunun üzerine güncelleme olarak kurulur.\n' >> "$notes"
          fi
          # A manual run creates the tag at the commit it built; a tag push already has one.
          target=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" "$apk" "$apk.sha256" "${target[@]}" --title "VHS Cam $tag" --notes-file "$notes"
